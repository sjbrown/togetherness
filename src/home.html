<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Togetherness Table</title>
<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3Ctext x='3' y='26' font-size='26' fill='%23fffff0' font-family='serif' letter-spacing='-5'%3ETT%3C/text%3E%3C/svg%3E">
<style>
/* ── Variables (matches ui.css palette) ─────────────────── */
:root {
  --bg:            #0d0b13;
  --surface:       rgba(22, 17, 34, 0.88);
  --surface-2:     rgba(36, 29, 52, 0.75);
  --surface-solid: #1a1228;
  --text:          #ddd0b4;
  --text-2:        #8a7d68;
  --text-3:        #4e4438;
  --border:        rgba(210,185,130,0.13);
  --border-2:      rgba(210,185,130,0.26);
  --primary:       #c8941e;
  --primary-soft:  rgba(200,148,30,0.20);
  --radius:        14px;
  --radius-sm:     10px;
  --emboss:
    inset 0 2px 0 rgba(210,185,130,0.40),
    inset 0 -1px 0 rgba(0,0,0,0.55),
    0 0 0 1px rgba(0,0,0,0.70),
    0 4px 18px rgba(0,0,0,0.55);
  --emboss-lg:
    inset 0 2px 0 rgba(210,185,130,0.40),
    inset 0 -1px 0 rgba(0,0,0,0.55),
    0 0 0 1px rgba(0,0,0,0.80),
    0 12px 40px rgba(0,0,0,0.70);
  --font-body:    -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-display: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Layout ──────────────────────────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 100vh;
}

@media (max-width: 768px) {
  .layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto;
  }
}

/* ── Left Panel ──────────────────────────────────────────── */
.panel {
  background: var(--surface-solid);
  border-right: 1px solid var(--border-2);
  display: flex;
  flex-direction: column;
  padding: 32px 24px 40px;
  gap: 32px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border-2) transparent;
}

@media (max-width: 768px) {
  .panel {
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border-2);
    padding: 28px 20px 32px;
  }
}

/* ── Wordmark ──────────────────────────────────────────────  */
.wordmark {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.wordmark-title {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: normal;
  letter-spacing: 0.04em;
  color: var(--text);
  margin: 0;
  line-height: 1;
}

.wordmark-title span {
  color: var(--primary);
}

.wordmark-sub {
  font-size: 11px;
  color: var(--text-2);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* ── Section headings ──────────────────────────────────────  */
.section-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  margin: 0 0 10px;
  font-family: var(--font-body);
}

/* ── Profile card ──────────────────────────────────────────  */
.profile-card {
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--emboss);
}

.profile-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.gradient-swatch {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid var(--border-2);
  cursor: pointer;
  transition: transform 0.15s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
.gradient-swatch:hover { transform: scale(1.08); }

.profile-name-input {
  flex: 1;
  background: rgba(0,0,0,0.35);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font-display);
  font-size: 15px;
  padding: 6px 10px;
  outline: none;
  transition: border-color 0.15s;
}
.profile-name-input:focus {
  border-color: var(--primary);
}
.profile-name-input::placeholder { color: var(--text-3); font-style: italic; }

.advanced-link {
  font-size: 11px;
  color: var(--text-3);
  text-decoration: none;
  align-self: flex-start;
}
.advanced-link:hover { color: var(--text-2); text-decoration: underline; }

.advanced-panel {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.advanced-label {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  font-family: var(--font-body);
}
.advanced-input {
  background: rgba(0,0,0,0.35);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: ui-monospace, monospace;
  font-size: 13px;
  padding: 6px 10px;
  outline: none;
  transition: border-color 0.15s;
}
.advanced-input:focus { border-color: var(--primary); }

/* gradient picker row */
.gradient-options {
  display: flex;
  gap: 8px;
  overflow: hidden;
  flex-wrap: nowrap;
}
.grad-option {
  flex: 1 1 0;
  min-width: 0;
  max-width: 26px;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.12s, border-color 0.12s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
.grad-option:hover { transform: scale(1.15); }
.gradient-options .grad-option { display: block; width: 100%; height: 100%; }
.grad-option.active { border-color: var(--primary); }

/* ── Tables list ───────────────────────────────────────────  */
.tables-section {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tables-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 424px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border-2) transparent;
}

.table-row {
  display: flex;
  align-items: stretch;
  gap: 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
  text-decoration: none;
  color: inherit;
}
.table-row:hover {
  background: var(--primary-soft);
  border-color: var(--border-2);
}

.table-thumb {
  display: block;
  width: 150px;
  height: 100px;
  flex-shrink: 0;
  object-fit: cover;
}
.table-thumb-placeholder {
  width: 150px;
  height: 100px;
  flex-shrink: 0;
  background: var(--surface-2);
}
.table-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  padding: 10px 12px;
  min-width: 0;
}
.table-name {
  font-size: 13px;
  color: var(--text);
  font-family: var(--font-display);
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.table-date {
  font-size: 10px;
  color: var(--text-3);
}

.table-actions {
  display: flex;
  align-self: flex-end;
  gap: 12px;
}

.table-delete {
  font-size: 11px;
  color: var(--text-3);
  background: none;
  border: none;
  padding: 2px 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.table-delete:hover {
  color: var(--danger);
}

.table-fork {
  font-size: 11px;
  color: var(--text-3);
  background: none;
  border: none;
  padding: 2px 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.table-fork:hover {
  color: var(--primary);
}
.table-fork:disabled {
  cursor: default;
  text-decoration: none;
  opacity: 0.6;
}

.tables-empty {
  font-size: 12px;
  color: var(--text-3);
  font-style: italic;
  padding: 6px 2px;
}

/* ── Links footer ──────────────────────────────────────────  */
.panel-footer {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.footer-link {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-2);
  text-decoration: none;
  padding: 4px 2px;
  transition: color 0.12s;
}
.footer-link:hover { color: var(--primary); }
.footer-link svg { flex-shrink: 0; opacity: 0.7; }

.footer-tagline {
  font-size: 10px;
  color: var(--text-3);
  line-height: 1.5;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

/* ── Sampler (right) ───────────────────────────────────────  */
.sampler {
  display: flex;
  flex-direction: column;
}

.sampler-row {
  position: relative;
  flex: 1;
  min-height: 200px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

@media (max-width: 768px) {
  .sampler-row { min-height: 180px; }
}

.sampler-scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transition: transform 0.4s ease;
}
.sampler-row:hover .sampler-scene { transform: scale(1.03); }

/* Tint overlay — per-row colour set via --tint CSS var on the div */
.sampler-row::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--tint);
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 1;
}
.sampler-row:hover::after { opacity: 0.5; }

/* loading spinner — shown in place of the Start Here button while a row's
   start-table SVG is still being fetched */
.sampler-spinner {
  display: none;
  position: absolute;
  z-index: 2;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 3px solid rgba(210,185,130,0.18);
  border-top-color: var(--primary);
  pointer-events: none;
  animation: sampler-spin 0.8s linear infinite;
}
.sampler-row.loading .sampler-spinner { display: block; }
.sampler-row.loading .start-btn { display: none; }
@keyframes sampler-spin {
  to { transform: rotate(360deg); }
}

/* start button */
.start-btn {
  pointer-events: none;
  position: absolute;
  z-index: 2;
  background: rgba(14, 10, 22, 0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(200,148,30,0.55);
  color: var(--primary);
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.08em;
  padding: 11px 28px;
  border-radius: 40px;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(210,185,130,0.30),
    0 0 0 1px rgba(0,0,0,0.6),
    0 8px 30px rgba(0,0,0,0.6),
    0 0 20px rgba(200,148,30,0.10);
  transition: background 0.15s, box-shadow 0.15s, transform 0.12s, color 0.15s;
  white-space: nowrap;
}
.start-btn:hover {
  background: rgba(200,148,30,0.18);
  color: #e8b84a;
  box-shadow:
    inset 0 1px 0 rgba(210,185,130,0.40),
    0 0 0 1px rgba(200,148,30,0.45),
    0 0 24px rgba(200,148,30,0.25),
    0 8px 30px rgba(0,0,0,0.6);
  transform: scale(1.04);
}
.start-btn:active { transform: scale(0.97); }

/* separator lines between rows */
.sampler-row + .sampler-row::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: rgba(210,185,130,0.12);
  z-index: 1;
}

/* ── Ripple / transition overlay ───────────────────────────  */
#ripple {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  overflow: hidden;
}
#ripple-circle {
  position: absolute;
  border-radius: 50%;
  background: var(--bg);
  transform: scale(0);
  transform-origin: center;
  transition: none;
  width: 10px;
  height: 10px;
}

/* ── Scroll fade-ins ───────────────────────────────────────  */
.fade-in {
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.fade-in.visible {
  opacity: 1;
  transform: none;
}
</style>
</head>

<script type="module">
import { mirrorYNode, buildThumbSVG, THUMB_W, THUMB_H } from './home-utils.js';
import { populateFromSvgDoc }   from './storage.js';
import * as Toys                from './toys.js';

import { entityGradient }        from './entity_gradient.js';
import { getIdentity, setName, setGrad } from './user.js';
import { tablesAPI as tables } from './tables.js';
import {
  getStoredSignalingServer, setStoredSignalingServer, defaultSignalingServer,
  getStoredFallbackSignalingServer, setStoredFallbackSignalingServer, defaultFallbackSignalingServer,
} from './signaling.js';

function drawGradientSwatch(canvas, gradObj) {
  const ctx  = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  grad.addColorStop(0, gradObj.c1);
  grad.addColorStop(1, gradObj.c2);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.beginPath();
  ctx.arc(canvas.width/2, canvas.height/2, canvas.width/2, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
}

// ── Profile UI ────────────────────────────────────────────────────────────
// Player identity lives in localStorage, key 'tt_player' (see user.js).
// index.html reads from the same store on boot.

const displayNameEl = document.getElementById('displayName');
const swatchEl      = document.getElementById('gradientSwatch');
const gradOptsEl    = document.getElementById('gradientOptions');

let _grad = null;  // full entityGradient() output, stored frozen

function initProfile() {
  const { name, grad } = getIdentity();
  _grad = grad;

  displayNameEl.value = name;
  refreshSwatch();
  renderGradOptions();
}

function refreshSwatch() {
  drawGradientSwatch(swatchEl, _grad);
}

function renderGradOptions() {
  gradOptsEl.innerHTML = '';
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  for (let i = 0; i < 20; i++) {
    const seed      = Array.from({ length: 8 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    const presetGrad = entityGradient(seed);
    const c = document.createElement('canvas');
    c.className = 'grad-option';
    c.width = 26; c.height = 26;
    if (_grad && presetGrad.c1 === _grad.c1 && presetGrad.c2 === _grad.c2) {
      c.classList.add('active');
    }
    drawGradientSwatch(c, presetGrad);
    c.addEventListener('click', () => {
      _grad = presetGrad;
      document.querySelectorAll('.grad-option').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      setGrad(_grad);
      refreshSwatch();
    });
    gradOptsEl.appendChild(c);
  }
}

swatchEl.addEventListener('click', () => {
  _grad = entityGradient('rng_' + Math.random().toString(36).slice(2));
  document.querySelectorAll('.grad-option').forEach(x => x.classList.remove('active'));
  setGrad(_grad);
  refreshSwatch();
});

displayNameEl.addEventListener('input', () => {
  setName(displayNameEl.value.trim());
});

initProfile();

// ── Advanced: signaling server(s) ────────────────────────────────────────────
// Each field shows the localStorage override if one exists, else its
// host-based default — but that default is NOT written to localStorage
// until the person actually edits the field (see signaling.js). y-webrtc
// connects to both servers concurrently rather than falling over from one
// to the other; "fallback" describes intent, not the connection mechanics.
const advancedLinkEl     = document.getElementById('advancedLink');
const advancedPanelEl    = document.getElementById('advancedPanel');
const signalingEl        = document.getElementById('signalingServer');
const signalingFallbackEl = document.getElementById('signalingServerFallback');

advancedLinkEl.addEventListener('click', (e) => {
  e.preventDefault();
  const opening = advancedPanelEl.style.display === 'none';
  advancedPanelEl.style.display = opening ? 'flex' : 'none';
  if (opening) {
    signalingEl.value         = getStoredSignalingServer() ?? defaultSignalingServer();
    signalingFallbackEl.value = getStoredFallbackSignalingServer() ?? defaultFallbackSignalingServer();
  }
});

signalingEl.addEventListener('change', () => {
  const value = signalingEl.value.trim();
  // Only persist if the person actually changed it away from the default —
  // otherwise a future change to the built-in default would be masked by
  // a stored value nobody meant to set.
  if (value && value !== defaultSignalingServer()) {
    setStoredSignalingServer(value);
  } else {
    setStoredSignalingServer(null);
  }
});

signalingFallbackEl.addEventListener('change', () => {
  const value = signalingFallbackEl.value.trim();
  if (value && value !== defaultFallbackSignalingServer()) {
    setStoredFallbackSignalingServer(value);
  } else {
    setStoredFallbackSignalingServer(null);
  }
});

// ── Previous tables ───────────────────────────────────────────────────────

async function makeThumbnail(tableId) {
  try {
    const ydoc  = await tables.loadTableDoc(tableId);
    const yMeta = ydoc.getMap('meta');

    const bgUrl = yMeta.get('bg_url')    || 'img/bg_default.png';
    const bgW   = yMeta.get('bg_width')  || 120;
    const bgH   = yMeta.get('bg_height') || 120;

    // Topmost toy = last child in the projected toys layer (DOM order = z-order)
    const layerEl = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    Toys.projectLayer(ydoc, layerEl, { tableId, isCreator: false });
    const toyEl = layerEl.lastElementChild ? layerEl.lastElementChild.cloneNode(true) : null;
    toyEl.firstChild.setAttribute('width', '100');
    toyEl.firstChild.setAttribute('height', '100');

    ydoc.destroy();
    return buildThumbSVG(tableId, bgUrl, bgW, bgH, toyEl);
  } catch (e) {
    console.warn('togetherness: thumbnail failed for', tableId, e);
    return null;
  }
}

function renderTables() {
  const list = tables.loadTables();
  const el   = document.getElementById('tablesList');
  if (!list.length) {
    el.innerHTML = '<div class="tables-empty">No previous tables yet.<br>Start one from the right →</div>';
    return;
  }
  el.innerHTML = '';
  list.slice().reverse().forEach(t => {
    const a = document.createElement('a');
    a.className = 'table-row';
    a.href = `index.html#${encodeURIComponent(t.id)}`;

    // Placeholder shown while thumbnail loads async
    const placeholder = document.createElement('div');
    placeholder.className = 'table-thumb-placeholder';
    a.appendChild(placeholder);

    const info = document.createElement('div');
    info.className = 'table-info';

    const name = document.createElement('span');
    name.className = 'table-name';
    name.textContent = t.name || t.id;

    const date = document.createElement('span');
    date.className = 'table-date';
    date.textContent = new Date(t.lastVisit).toISOString().slice(0, 10);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'table-delete';
    del.textContent = 'Delete';
    del.addEventListener('click', (e) => {
      // Row is an <a>; stop the click from also navigating to the table.
      e.preventDefault();
      e.stopPropagation();
      if (confirm(`Delete "${t.name || t.id}"? This can't be undone.`)) {
        tables.deleteTable(t.id);
        renderTables();
      }
    });

    const fork = document.createElement('button');
    fork.type = 'button';
    fork.className = 'table-fork';
    fork.textContent = 'Duplicate (Fork)';
    fork.addEventListener('click', async (e) => {
      // Row is an <a>; stop the click from also navigating to the table.
      e.preventDefault();
      e.stopPropagation();
      fork.disabled = true;
      fork.textContent = 'Forking…';
      try {
        // Extends the ancestor's own id (not a fresh generateTableId
        // call) so a duplicated table sorts right next to the one it
        // came from — a deliberate, human-initiated fork gets to look
        // like what it is. Contrast generateForkTableId: an automatic
        // conflict-fork needs a name every peer can independently land
        // on with no coordination, so it's a content hash instead.
        const forkedId   = `${t.id}-fork-${tables.randSlug()}`;
        const forkedName = t.name ? `${t.name} (fork)` : forkedId;
        const { localId: forkingUserId } = getIdentity();
        await tables.forkTable(t.id, forkedId, forkingUserId);
        tables.touchTableRecord(forkedId, { name: forkedName });
        renderTables();
      } catch (err) {
        console.error('togetherness: fork failed for', t.id, err);
        fork.disabled = false;
        fork.textContent = 'Duplicate (Fork)';
        alert('Fork failed — see console for details.');
      }
    });

    const actions = document.createElement('div');
    actions.className = 'table-actions';
    actions.append(fork, del);

    info.append(name, date, actions);
    a.appendChild(info);
    el.appendChild(a);

    // Load thumbnail async, swap in when ready
    makeThumbnail(t.id).then(svg => {
      if (svg) placeholder.replaceWith(svg);
    });
  });
}
renderTables();

// On back-navigation (bfcache restore): reset ripple and refresh tables list.
window.addEventListener('pageshow', () => {
  const circle = document.getElementById('ripple-circle');
  circle.style.transition = 'none';
  circle.style.transform  = 'scale(0)';
  renderTables();
});

// ── Sampler previews: load each row's starting-table SVG doc ─────────────────
// The starting states themselves (background + baked-in toys) live in
// src/start_tables/*.svg — see that folder — not in this page. Each row
// names its file via data-start-table; fetch it, parse it, and inject the
// <svg> as the row's preview scene. The same parsed element is what
// seedTable hands to the standard Load machinery (populateFromSvgDoc) on
// click, so the preview is exactly what gets loaded — no separate
// display-only path to drift out of sync.
function loadStartTable(row) {
  const file = row.dataset.startTable;
  return fetch(`start_tables/${file}`)
    .then(res => res.text())
    .then(text => {
      const doc   = new DOMParser().parseFromString(text, 'image/svg+xml');
      const svgEl = document.importNode(doc.documentElement, true);
      row.insertBefore(svgEl, row.querySelector('.start-btn'));
      row.classList.remove('loading');
      return svgEl;
    })
    .catch(err => {
      console.error('togetherness: failed to load start table', file, err);
      row.classList.remove('loading');
      return null;
    });
}

const startTableRows = document.querySelectorAll('.sampler-row[data-start-table]');
const rowSvgReady = new Map(
  Array.from(startTableRows, row => [row, loadStartTable(row)])
);

// ── Seed a new table from a sample SVG into IndexedDB ────────────────────────
// Uses storage.js import machinery to read svg contents from a sampler
// template into the live doc getYDoc() hands back
async function seedTable(tableId, sampleSvgEl) {
  const { ydoc } = await tables.getYDoc(tableId);
  const { localId: myId } = getIdentity();
  ydoc.transact(() => {
    // Sampler templates carry a decorative rotation on each toy <g> for
    // homepage visual flair — not part of the canonical seeded document.
    populateFromSvgDoc(sampleSvgEl, ydoc, { stripToyDecorative: true, asNewTable: true, authorId: myId });
  });

  // Join the authority ordering here, not in index.html: this table id was
  // just generated a moment ago (tables.generateTableId, above), so nobody
  // else can possibly know it yet — genuinely unambiguous, unlike a
  // typed/pasted #tableId index.html has never seen (see
  // join_intent.js's module comment). Doing it here means index.html's own
  // boot logic never needs a special "I was just created" case at all: by
  // the time it loads this table, isCreator is just a fact already sitting
  // in the doc (see index.html's isCreator derivation).
  tables.ensureJoined(ydoc, myId, { isCreator: true });

  // ensure the doc is synced to Indexeddb before we navigate away
  await tables.openTablePersistence(tableId, ydoc);
}

// ── Wire sampler row clicks to their (possibly still-loading) preview ────────
startTableRows.forEach(el => {
  el.addEventListener('click', async e => {
    const svgEl = await rowSvgReady.get(el);
    if (!svgEl) return;
    launchRipple(e.clientX, e.clientY, svgEl);
  });
});

// ── Ripple transition + table seeding ─────────────────────────────────────────
function launchRipple(cx, cy, svgEl) {
  const circle = document.getElementById('ripple-circle');
  const maxDist = Math.hypot(
    Math.max(cx, window.innerWidth  - cx),
    Math.max(cy, window.innerHeight - cy)
  );
  const diameter = maxDist * 2.2;
  circle.style.transition = 'none';
  circle.style.width      = diameter + 'px';
  circle.style.height     = diameter + 'px';
  circle.style.left       = (cx - diameter/2) + 'px';
  circle.style.top        = (cy - diameter/2) + 'px';
  circle.style.transform  = 'scale(0)';
  circle.getBoundingClientRect();
  circle.style.transition = 'transform 0.55s cubic-bezier(0.4,0,0.2,1)';
  circle.style.transform  = 'scale(1)';

  const tableId = tables.generateTableId(displayNameEl.value.trim());
  tables.touchTableRecord(tableId);

  // Seed the table into IndexedDB, then navigate once done (or after the
  // ripple animation completes, whichever is later). seedTable already
  // joined the authority ordering as part of seeding, so index.html's own
  // boot logic just sees an already-known table with this browser's id
  // first in its joinSequence — no marker needed.
  const seedDone    = seedTable(tableId, svgEl);
  const rippleDone  = new Promise(r => setTimeout(r, 520));
  Promise.all([seedDone, rippleDone]).then(() => {
    window.location.href = `index.html#${tableId}`;
  }).catch(err => {
    console.error('togetherness: table seed failed', err);
    window.location.href = `index.html#${tableId}`;
  });
}

// ── Intersection observer for fade-ins ────────────────────────────────────────
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
  });
}, { threshold: 0.05 });

document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
</script>

</body>

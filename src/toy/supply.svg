  <script
     type="text/javascript"
     data-namespace="supply"
     id="script_supply"><![CDATA[

var supply = {

  menu: {
    'Take': {
      eventName: 'supply_take',
      applicable: (node) => { 
         return node.getAttribute('data-below')
      },
      handler: function(evt) {
        console.log('supply take', this)
        supply._take(this)
      },
    },
  },

  _getTarget: function(elem) {
    const itemId = elem.getAttribute('data-below')
  },

  _take: function(elem) {
    const itemId = elem.getAttribute('data-below')
    if (!itemId) {
      supply._event('warn', {msg: 'Supply needs a prototype toy'})
      return
    }
    // Placement is the harness's call, not ours — it'll use our
    // .tt_target marker if we have one, else its own judgement.
    supply._event('toy:clone', {id: itemId, sourceEl: elem})
  },

  _event: function(evName, args) {
    const detail = { ...args, retval: {} };
    document.dispatchEvent(new CustomEvent(evName, { detail }));
    if (detail.error) throw new Error(detail.error);
    return detail.retval;
  },

  // Runs once at placement - including during clone (eg, from a supply)
  initialize: function(elem) {
    elem.setAttribute('data-below', '')
    elem.setAttribute('data-above', '')
  },

  on_position_occupied: function(elem, posId, ownerId, movingId) {
    elem.setAttribute('data-below', movingId)
  },

  on_position_vacated: function(elem, posId, ownerId, movingId) {
    elem.setAttribute('data-below', '')
  },

}

  ]]></script>


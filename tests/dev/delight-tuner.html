<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Delight Tuner</title>
<style>
  /* Layout: controls column on the left, table stage filling the rest; the panel overlays the stage on phones. */
  :root {
    --bg: #f4f5f3;
    --panel: #ffffff;
    --text: #2c302d;
    --muted: #6f7570;
    --border: #d9ddd8;
    --accent: #2f7d5b;
    --plot-x: #c2571f;
    --plot-y: #2f6fb5;
    --plot-grid: #d9ddd8;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #181a19; --panel: #222524; --text: #e2e5e2; --muted: #98a09a; --border: #3a3f3c;
      --accent: #5fbf8f; --plot-x: #f08a50; --plot-y: #6aa8f0; --plot-grid: #3a3f3c; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #181a19; --panel: #222524; --text: #e2e5e2; --muted: #98a09a; --border: #3a3f3c;
    --accent: #5fbf8f; --plot-x: #f08a50; --plot-y: #6aa8f0; --plot-grid: #3a3f3c; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text);
    display: flex; overflow: hidden; font-size: 13px;
  }
  #panel {
    width: 380px; flex: none; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--border);
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: 16px;
  }
  #panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
  h2 { font-size: 12px; letter-spacing: 0.06em; margin: 16px 0 4px; text-transform: uppercase; color: var(--muted); }
  label.top { display: block; margin: 8px 0 2px; font-weight: 600; }
  select, input[type=range] { width: 100%; }
  button { font: inherit; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #panel-close { border: none; background: none; font-size: 22px; line-height: 1; padding: 0 4px; }

  #toy-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #toy-picker button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 11px; }
  #toy-picker button svg { width: 34px; height: 34px; }
  #toy-picker button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

  .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .check { display: flex; gap: 6px; align-items: center; }

  #tuning fieldset { border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px 8px; margin: 8px 0 0; min-width: 0; }
  #tuning legend { font-weight: 600; padding: 0 4px; }
  #tuning .note { color: var(--muted); margin: 2px 0 4px; line-height: 1.35; }
  .t-row { display: grid; grid-template-columns: 1fr 130px 44px; gap: 6px; align-items: center; margin-top: 4px; }
  .t-row.color { grid-template-columns: 1fr 36px 88px 44px; }
  .t-row.wide { grid-template-columns: 1fr 174px; }
  .t-row span.v { font-family: var(--mono); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
  .t-row input[type=color] { width: 36px; height: 22px; padding: 0; border: none; background: none; }
  .t-row.off { opacity: 0.45; }

  #plot { width: 100%; height: auto; display: block; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); }
  #plot text { font-family: var(--mono); font-size: 9px; fill: var(--muted); }
  .legend { display: flex; gap: 12px; color: var(--muted); font-size: 11px; margin-top: 4px; }
  .legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; }

  #values { width: 100%; height: 110px; margin-top: 6px; font-family: var(--mono); font-size: 11px;
            background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
  #log { font-family: var(--mono); font-size: 11px; color: var(--muted); max-height: 120px; overflow-y: auto; white-space: pre-wrap; }

  #stage { flex: 1; position: relative; overflow: hidden; background: var(--table, #2d5b45); min-width: 0; }
  #svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #stage:not([data-effect="plop"]) #svg { cursor: default; }
  #stage[data-effect="skid"] #toys-layer .toy { cursor: grab; }
  #stage[data-effect="cloudburst"] #toys-layer .toy { cursor: pointer; }
  #toys-layer .toy.tuner-selected { outline: none; }
  .tuner-sel-ring { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }
  #hint {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    background: rgba(0,0,0,0.45); color: #fff; padding: 6px 12px; border-radius: 14px; font-size: 12px; pointer-events: none;
    max-width: calc(100% - 32px); text-align: center;
  }
  #panel-open {
    position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
    display: none; z-index: 2; background: var(--panel);
  }
  body.panel-closed #panel { display: none; }
  body.panel-closed #panel-open { display: block; }
  @media (max-width: 700px) {
    #panel { position: absolute; z-index: 3; top: 0; left: 0; bottom: 0; width: min(380px, 100vw); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  }
</style>
</head>
<body>

<div id="panel">
  <div id="panel-head">
    <h1>Delight tuner</h1>
    <button id="panel-close" title="Close controls" aria-label="Close controls">×</button>
  </div>
  <label class="top" for="effect">Effect</label>
  <select id="effect">
    <option value="plop">Plop: adding a toy</option>
    <option value="skid">Skid: moving a toy</option>
    <option value="cloudburst">Cloudburst: deleting toys</option>
  </select>
  <div class="subtitle" id="effect-notes"></div>

  <div id="plop-only">
    <label class="top">Tool</label>
    <div id="toy-picker"></div>

    <label class="top" for="preset">Preset</label>
    <select id="preset"></select>
  </div>

  <div class="btn-row">
    <button id="replay">Replay</button>
    <button id="clear">Clear table</button>
    <button id="reseed">Reset toys</button>
    <label class="check"><input type="checkbox" id="loop"> Loop replay</label>
  </div>

  <h2 id="plot-title">Shape over time</h2>
  <svg id="plot" viewBox="0 0 340 120" role="img" aria-label="The effect's curves over time"></svg>
  <div class="legend"><span id="legend-a"><i style="background:var(--plot-x)"></i><b></b></span><span id="legend-b"><i style="background:var(--plot-y)"></i><b></b></span><span id="plot-total"></span></div>

  <h2>Tuning</h2>
  <div id="tuning"></div>
  <div class="btn-row">
    <button id="copy-values">Copy values</button>
    <button id="reset-values">Reset</button>
    <span id="copy-status" style="color:var(--muted)"></span>
  </div>
  <textarea id="values" readonly aria-label="Current values"></textarea>

  <h2>Log</h2>
  <div id="log"></div>
</div>

<div id="stage">
  <button id="panel-open">☰ Controls</button>
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="puff-blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur id="puff-blur-sd" stdDeviation="1.2"/></filter>
      <filter id="shadow-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
      <filter id="skid-blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.3"/></filter>
      <filter id="cb-blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>
    <g id="world">
      <g id="toys-layer"></g>
      <g id="selection_local" pointer-events="none"></g>
      <g id="delight-layer" pointer-events="none"></g>
    </g>
  </svg>
  <div id="hint"></div>
</div>

<style id="hide-rules"></style>

<script>
const SVGNS = 'http://www.w3.org/2000/svg';
// Served by bin/dev.sh at /dev/, beside the app's /toy/.
const TOY_FILES = { d6: ['dice_d6.svg', 'd6'], chip: ['chip.svg', 'Chip'], meeple: ['meeple.svg', 'Meeple'], card: ['single_poker_card.svg', 'Card'] };
const TOYS = {};
// The published copy has the toys inlined here; served from /dev/ it fetches them.
const INLINE_TOYS = /*__TOYS_INLINE__*/null;
async function loadToys() {
  if (INLINE_TOYS) { Object.assign(TOYS, INLINE_TOYS); return; }
  for (const [type, [file, label]] of Object.entries(TOY_FILES)) {
    const res = await fetch(`/toy/${file}`);
    if (!res.ok) throw new Error(`/toy/${file}: ${res.status}`);
    const markup = (await res.text())
      .replace(/<\?xml[^>]*\?>/, '')
      .replace(/<script[\s\S]*?<\/script>/g, '')
      .replace(/<metadata[\s\S]*?<\/metadata>/g, '')
      .replace(/<sodipodi:namedview[\s\S]*?(\/>|<\/sodipodi:namedview>)/g, '')
      .trim();
    const root = markup.match(/<svg[\s\S]*?>/)[0];
    TOYS[type] = { label, w: +root.match(/\swidth="([\d.]+)"/)[1], h: +root.match(/\sheight="([\d.]+)"/)[1], markup };
  }
}

// ── Tuning schema ────────────────────────────────────────────────────────
const EASES = {
  'ease-out':      [0.2, 0.7, 0.3, 1],
  'ease-in':       [0.55, 0, 0.9, 0.45],
  'ease-in-out':   [0.6, 0, 0.4, 1],
  'back-out':      [0.34, 1.56, 0.64, 1],
  'linear':        [0, 0, 1, 1],
};
const easeOpts = Object.keys(EASES).map(k => [k, k]);

const TUNING = [
  { group: 'Trigger and look', effect: 'plop', rows: [
    { key: 'trigger', label: 'Trigger', type: 'select', def: 'press', opts: [
      ['release', 'Everything on release'], ['press', 'Squash on press, stretch on release']] },
    { key: 'projection', label: 'Deform as', type: 'select', def: 'top', opts: [
      ['side', 'Side view: squash Y, widen X'], ['top', 'Top-down: uniform scale']] },
    { key: 'intro', label: 'Entrance', type: 'select', def: 'fall', opts: [
      ['none', 'Appear in place'], ['fall', 'Drop in from above'], ['preview', 'Grow out of cursor preview']] },
    { key: 'anchor', label: 'Pivot', type: 'select', def: 'center', opts: [['bottom', 'Bottom edge'], ['center', 'Centre']] },
    { key: 'axis', label: 'Squash axis', type: 'select', def: 'screen', opts: [['screen', 'Screen (ignores rotation)'], ['toy', 'Toy (rotates with it)']] },
  ]},
  { group: 'Squash', effect: 'plop', rows: [
    { key: 'squash',    label: 'Amount',          type: 'num', min: 0, max: 0.6, step: 0.01, def: 0.1 },
    { key: 'squashMs',  label: 'Duration (ms)',   type: 'num', min: 20, max: 400, step: 5, def: 90 },
    { key: 'squashEase',label: 'Easing',          type: 'select', def: 'ease-out', opts: easeOpts },
    { key: 'volume',    label: 'Keep area (side view)', type: 'num', min: 0, max: 1, step: 0.05, def: 1 },
    { key: 'topGain',   label: 'Spread (top-down)', type: 'num', min: 0, max: 1.5, step: 0.05, def: 1 },
    { key: 'holdExtra', label: 'Extra squash while held', type: 'num', min: 0, max: 0.4, step: 0.01, def: 0.1, only: { trigger: 'press' } },
    { key: 'holdMs',    label: 'Held time to max (ms)', type: 'num', min: 0, max: 2000, step: 50, def: 1000, only: { trigger: 'press' } },
  ]},
  { group: 'Stretch and settle', effect: 'plop', rows: [
    { key: 'stretch',   label: 'Stretch amount',  type: 'num', min: 0, max: 0.6, step: 0.01, def: 0.15 },
    { key: 'stretchMs', label: 'Stretch duration (ms)', type: 'num', min: 20, max: 400, step: 5, def: 60 },
    { key: 'stretchEase', label: 'Stretch easing', type: 'select', def: 'ease-out', opts: easeOpts },
    { key: 'springHz',  label: 'Wobble frequency (Hz)', type: 'num', min: 1, max: 14, step: 0.25, def: 5 },
    { key: 'damping',   label: 'Wobble damping', type: 'num', min: 0.05, max: 1, step: 0.01, def: 0.45 },
  ]},
  { group: 'Entrance', effect: 'plop', rows: [
    { key: 'introMs',     label: 'Duration (ms)',   type: 'num', min: 40, max: 600, step: 10, def: 200, onlyNot: { intro: 'none' } },
    { key: 'fallHeight',  label: 'Drop height (screen px)', type: 'num', min: 0, max: 200, step: 2, def: 60, only: { intro: 'fall' } },
    { key: 'fallStretch', label: 'Stretch while falling', type: 'num', min: 0, max: 0.5, step: 0.01, def: 0.05, only: { intro: 'fall' } },
    { key: 'shadow',      label: 'Contact shadow',  type: 'bool', def: true },
    { key: 'shadowOpacity', label: 'Shadow opacity', type: 'num', min: 0, max: 0.8, step: 0.05, def: 0.2, only: { shadow: true } },
  ]},
  { group: 'Dust puff', effect: 'plop', rows: [
    { key: 'puff',        label: 'Show puff',       type: 'bool', def: true },
    { key: 'puffWhen',    label: 'Fires at', type: 'select', def: 'impact', opts: [['impact', 'Impact (start of squash)'], ['release', 'Pointer release'], ['stretch', 'Stretch peak']], only: { puff: true } },
    { key: 'puffDelay',   label: 'Offset (ms)',     type: 'num', min: -100, max: 200, step: 5, def: 0, only: { puff: true } },
    { key: 'puffCount',   label: 'Count',           type: 'num', min: 1, max: 24, step: 1, def: 5, only: { puff: true } },
    { key: 'puffSpread',  label: 'Start ring (of toy width)', type: 'num', min: 0, max: 1, step: 0.05, def: 0.6, only: { puff: true } },
    { key: 'puffDist',    label: 'Travel (screen px)', type: 'num', min: 0, max: 80, step: 1, def: 30, only: { puff: true } },
    { key: 'puffRise',    label: 'Rise (screen px)', type: 'num', min: 0, max: 30, step: 1, def: 10, only: { puff: true } },
    { key: 'puffFlatten', label: 'Flatten (1 = circle)', type: 'num', min: 0.1, max: 1, step: 0.05, def: 0.8, only: { puff: true } },
    { key: 'puffSize',    label: 'Start radius (screen px)', type: 'num', min: 1, max: 20, step: 0.5, def: 2.5, only: { puff: true } },
    { key: 'puffGrow',    label: 'Grows by', type: 'num', min: 1, max: 4, step: 0.1, def: 3, only: { puff: true } },
    { key: 'puffMs',      label: 'Duration (ms)',   type: 'num', min: 100, max: 1500, step: 10, def: 500, only: { puff: true } },
    { key: 'puffJitter',  label: 'Randomness',      type: 'num', min: 0, max: 1, step: 0.05, def: 0.4, only: { puff: true } },
    { key: 'puffColor',   label: 'Colour',          type: 'color', def: '#ece6d6', alpha: 0.4, only: { puff: true } },
    { key: 'puffBlur',    label: 'Softness (blur px)', type: 'num', min: 0, max: 4, step: 0.1, def: 2.3, only: { puff: true } },
    { key: 'puffRing',    label: 'Add shock ring',  type: 'bool', def: false, only: { puff: true } },
  ]},
  { group: 'How it is wired', effect: 'plop', note: 'These mimic the app: placement is async, initialize() can change the toy after it lands, and the real toy must be hidden without touching its DOM.', rows: [
    { key: 'cloneMethod', label: 'Clone', type: 'select', def: 'use', opts: [
      ['use', '<use href> (live)'], ['clone', 'cloneNode of real toy'], ['template', 'Built from template only']] },
    { key: 'realToy', label: 'Real toy while animating', type: 'select', def: 'hidden', opts: [
      ['hidden', 'Hidden by a page stylesheet rule'], ['faint', 'Faint (shows where it really is)'], ['visible', 'Visible underneath']] },
    { key: 'fetchDelay', label: 'Template fetch delay (ms)', type: 'num', min: 0, max: 600, step: 10, def: 0 },
    { key: 'initChange', label: 'initialize() changes the toy', type: 'bool', def: true },
  ]},
  { group: 'Skid', effect: 'skid', note: 'How far the puffs go grows with how far the toy went, both in screen px: from the floor for a short move up to the ceiling once the toy has gone the distance below.', rows: [
    { key: 'skidCount',   label: 'Count',            type: 'num', min: 1, max: 12, step: 1, def: 3 },
    { key: 'skidArc',     label: 'Arc (deg)',        type: 'num', min: 0, max: 360, step: 5, def: 90 },
    { key: 'skidMinDist', label: 'Puff travel floor (px)', type: 'num', min: 0, max: 200, step: 5, def: 50 },
    { key: 'skidMaxDist', label: 'Puff travel ceiling (px)', type: 'num', min: 0, max: 400, step: 5, def: 180 },
    { key: 'skidMaxAt',   label: 'Ceiling at toy travel (px)', type: 'num', min: 50, max: 2000, step: 50, def: 800 },
  ]},
  { group: 'Skid puff', effect: 'skid', rows: [
    { key: 'skidSpread',  label: 'Start ring (of toy size)', type: 'num', min: 0, max: 1, step: 0.05, def: 0.6 },
    { key: 'skidRise',    label: 'Rise (px)',        type: 'num', min: 0, max: 60, step: 1, def: 10 },
    { key: 'skidMs',      label: 'Duration (ms)',    type: 'num', min: 100, max: 2000, step: 10, def: 500 },
    { key: 'skidRiseMs',  label: 'Rise duration (ms, 0 = same)', type: 'num', min: 0, max: 2000, step: 10, def: 0 },
    { key: 'skidFlatten', label: 'Flatten (1 = circle)', type: 'num', min: 0.1, max: 1, step: 0.05, def: 0.8 },
    { key: 'skidSize',    label: 'Start radius (px)', type: 'num', min: 1, max: 20, step: 0.5, def: 2.5 },
    { key: 'skidGrow',    label: 'Grows by',         type: 'num', min: 1, max: 6, step: 0.1, def: 3 },
    { key: 'skidJitter',  label: 'Randomness',       type: 'num', min: 0, max: 1, step: 0.05, def: 0.4 },
    { key: 'skidColor',   label: 'Colour',           type: 'color', def: '#ece6d6', alpha: 0.4 },
    { key: 'skidBlur',    label: 'Softness (blur px)', type: 'num', min: 0, max: 6, step: 0.1, def: 2.3 },
  ]},
  { group: 'Cloudburst', effect: 'cloudburst', rows: [
    { key: 'cbCount',   label: 'Count',              type: 'num', min: 1, max: 30, step: 1, def: 10 },
    { key: 'cbSpread',  label: 'Start ring (of toy size)', type: 'num', min: 0, max: 1.5, step: 0.05, def: 0.5 },
    { key: 'cbDist',    label: 'Outward travel (px)', type: 'num', min: 0, max: 200, step: 1, def: 40 },
    { key: 'cbRise',    label: 'Rise (px)',          type: 'num', min: 0, max: 120, step: 1, def: 28 },
    { key: 'cbMs',      label: 'Duration (ms)',      type: 'num', min: 100, max: 3000, step: 10, def: 1100 },
    { key: 'cbRiseMs',  label: 'Rise duration (ms, 0 = same)', type: 'num', min: 0, max: 3000, step: 10, def: 550 },
    { key: 'cbFlatten', label: 'Flatten (1 = circle)', type: 'num', min: 0.1, max: 1, step: 0.05, def: 0.8 },
    { key: 'cbSize',    label: 'Start radius (px)',  type: 'num', min: 1, max: 20, step: 0.5, def: 4.5 },
    { key: 'cbGrow',    label: 'Grows by',           type: 'num', min: 1, max: 6, step: 0.1, def: 3.5 },
    { key: 'cbJitter',  label: 'Randomness',         type: 'num', min: 0, max: 1, step: 0.05, def: 0.5 },
    { key: 'cbColor',   label: 'Colour',             type: 'color', def: '#ece6d6', alpha: 0.5 },
    { key: 'cbBlur',    label: 'Softness (blur px)', type: 'num', min: 0, max: 6, step: 0.1, def: 3 },
  ]},
  { group: 'Preview only', effect: 'all', rows: [
    { key: 'slowmo',   label: 'Speed',          type: 'num', min: 0.05, max: 1, step: 0.05, def: 1 },
    { key: 'zoom',     label: 'Zoom',           type: 'num', min: 0.4, max: 2.5, step: 0.1, def: 1 },
    { key: 'rotation', label: 'Toy rotation (deg)', type: 'num', min: -180, max: 180, step: 5, def: 0 },
    { key: 'color',    label: 'Player colour',  type: 'select', def: '#d9534f', opts: [
      ['#d9534f', 'Red'], ['#3d7be0', 'Blue'], ['#e0a526', 'Amber'], ['#8a5cd6', 'Violet'], ['#3aa776', 'Green']] },
    { key: 'table',    label: 'Table',          type: 'select', def: '#2d5b45', opts: [
      ['#2d5b45', 'Green felt'], ['#6b4a33', 'Walnut'], ['#3a4250', 'Slate'], ['#d8cdb6', 'Parchment']] },
    { key: 'demoHold', label: 'Replay hold time (ms)', type: 'num', min: 0, max: 1500, step: 50, def: 400, only: { trigger: 'press' } },
  ]},
];

const PRESETS = {
  'Custom': null,
  'Shipped': {},
  'Subtle':  { squash: 0.12, squashMs: 70, stretch: 0.07, stretchMs: 90, springHz: 7, damping: 0.55, intro: 'none', puffCount: 6, puffDist: 14, puffMs: 420 },
  'Bouncy':  { squash: 0.22, squashMs: 90, stretch: 0.14, stretchMs: 110, springHz: 6, damping: 0.4, intro: 'none', puffCount: 8, puffDist: 22 },

    Object.assign(input, { id: inputId, type: 'range', min: r.min, max: r.max, step: r.step, value: V[r.key] });
    readout.textContent = V[r.key];
    input.addEventListener('input', () => { V[r.key] = +input.value; readout.textContent = input.value; applyTuning(); });
    row.append(input, readout);
  } else if (r.type === 'select') {
    row.className = 't-row wide';
    const sel = document.createElement('select');
    sel.id = inputId;
    for (const [v, t] of r.opts) { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); }
    sel.value = V[r.key];
    sel.addEventListener('input', () => { V[r.key] = sel.value; applyTuning(); });
    row.append(sel);
  } else if (r.type === 'bool') {
    row.className = 't-row';
    const cb = document.createElement('input');
    Object.assign(cb, { id: inputId, type: 'checkbox', checked: V[r.key] });
    cb.style.justifySelf = 'start';
    cb.addEventListener('input', () => { V[r.key] = cb.checked; applyTuning(); });
    row.append(cb, readout);
  } else {
    row.className = 't-row color';
    const color = document.createElement('input');
    Object.assign(color, { id: inputId, type: 'color', value: V[r.key].hex });
    const alpha = document.createElement('input');
    Object.assign(alpha, { type: 'range', min: 0, max: 1, step: 0.05, value: V[r.key].alpha, title: 'opacity' });
    alpha.setAttribute('aria-label', `${r.label} opacity`);
    readout.textContent = V[r.key].alpha;
    const update = () => { V[r.key] = { hex: color.value, alpha: +alpha.value }; readout.textContent = alpha.value; applyTuning(); };
    color.addEventListener('input', update);
    alpha.addEventListener('input', update);
    row.append(color, alpha, readout);
  }
  return row;
}

// ── Wiring ───────────────────────────────────────────────────────────────
function buildToyPicker() {
  const host = document.getElementById('toy-picker');
  host.replaceChildren();
  for (const [type, t] of Object.entries(TOYS)) {
    const b = document.createElement('button');
    b.setAttribute('aria-pressed', type === tool);
    const icon = buildToySvg(type, `pick-${type}`, V.color);
    icon.setAttribute('viewBox', `0 0 ${t.w} ${t.h}`);
    icon.removeAttribute('x'); icon.removeAttribute('y');
    icon.setAttribute('width', 34); icon.setAttribute('height', 34);
    const span = document.createElement('span'); span.textContent = t.label;
    b.append(icon, span);
    b.addEventListener('click', () => { tool = type; buildToyPicker(); buildAddCursor(); drawPlot(); });
    host.appendChild(b);
  }
}

const presetSel = document.getElementById('preset');
for (const name of Object.keys(PRESETS)) { const o = document.createElement('option'); o.value = name; o.textContent = name; presetSel.appendChild(o); }
presetSel.addEventListener('input', () => {
  const p = PRESETS[presetSel.value];
  if (!p) return;
  const keep = { zoom: V.zoom, rotation: V.rotation, color: V.color, table: V.table, slowmo: V.slowmo, cloneMethod: V.cloneMethod, realToy: V.realToy, fetchDelay: V.fetchDelay, initChange: V.initChange, demoHold: V.demoHold };
  defaultsInto(V);
  Object.assign(V, keep, p);
  buildTuningPanel();
  applyTuning({ fromPreset: true });
  replay();
});

document.getElementById('replay').addEventListener('click', replay);
document.getElementById('reseed').addEventListener('click', () => { seedToys(); logLine('toys reset'); });
document.getElementById('effect').addEventListener('input', (e) => {
  effect = e.target.value;
  applyEffect();
  buildTuningPanel();
  applyTuning();
});
document.getElementById('clear').addEventListener('click', () => {
  toysLayer.replaceChildren(); lastToy = null;
  for (const L of landings) L.root.remove();
  landings.clear(); hiddenIds.clear(); syncHideRules();
  logLine('table cleared');
});
document.getElementById('loop').addEventListener('input', () => { loopTimer = vNow; tick(); });
document.getElementById('reset-values').addEventListener('click', () => { defaultsInto(V); buildTuningPanel(); applyTuning(); buildToyPicker(); });
document.getElementById('copy-values').addEventListener('click', async () => {
  const text = valuesText();
  const status = document.getElementById('copy-status');
  try { await navigator.clipboard.writeText(text); status.textContent = 'Copied'; }
  catch {
    const ta = document.getElementById('values'); ta.focus(); ta.select();
    status.textContent = 'Selected: press Ctrl/Cmd+C';
  }
  setTimeout(() => { status.textContent = ''; }, 2500);
});
document.getElementById('panel-close').addEventListener('click', () => { document.body.classList.add('panel-closed'); layoutView(); });
document.getElementById('panel-open').addEventListener('click', () => { document.body.classList.remove('panel-closed'); layoutView(); });
window.addEventListener('resize', layoutView);

function init() {
  defaultsInto(V);
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? 'null');
    if (saved) for (const r of ROWS) if (r.key in saved) V[r.key] = saved[r.key];
  } catch {}
  try { const saved = localStorage.getItem(EFFECT_KEY); if (EFFECT_INFO[saved]) effect = saved; } catch {}
  if (matchMedia('(max-width: 700px)').matches) document.body.classList.add('panel-closed');
  applyEffect();
  buildTuningPanel();
  buildToyPicker();
  applyTuning();
  seedToys();
  requestAnimationFrame(loopCheck);
}
loadToys().then(init).catch((err) => {
  document.getElementById('hint').textContent = `Could not load toys: ${err.message}`;
  console.error(err);
});
</script>
